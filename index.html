<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORDA Top1 - Neon Grid</title>
<style>
  :root {
    --neon: #8B5A2B;
    --neon-soft: #A0522D;
    --gap: 26px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000000;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Montserrat', Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }

  .stage {
    position: relative;
    display: inline-block;
    padding: 10px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(90px, 200px));
    grid-template-rows: repeat(3, minmax(90px, 200px));
    gap: var(--gap);
  }

  .card {
    aspect-ratio: 1 / 1;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 40%, #0a0000 0%, #000000 70%);
    border: 2px solid var(--neon);
    border-radius: 6px;
  }

  .center-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    width: calc(var(--gap) * 3.2);
    text-align: center;
  }

  .center-text .forda {
    color: #ffffff;
    font-weight: 800;
    font-size: clamp(9px, 2.4vw, 15px);
    letter-spacing: 0.06em;
    white-space: nowrap;
    text-shadow: 0 0 6px rgba(255,255,255,0.6);
    margin-bottom: 6px;
  }

  .center-text .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .center-text .stack span {
    color: #ffffff;
    font-weight: 700;
    font-size: clamp(10px, 2.6vw, 16px);
    line-height: 1;
    text-shadow: 0 0 6px rgba(255,255,255,0.6);
  }

  .center-text .stack span:last-child {
    margin-top: 6px;
  }

  @media (max-width: 480px) {
    :root {
      --gap: 18px;
    }
    .grid {
      grid-template-columns: repeat(2, minmax(70px, 130px));
      grid-template-rows: repeat(3, minmax(70px, 130px));
    }
  }

  #page2 {
    display: none;
  }

  .lezzz-btn {
    background: transparent;
    color: #ffffff;
    border: 2px solid var(--neon);
    border-radius: 6px;
    padding: 14px 34px;
    font-family: 'Montserrat', Arial, Helvetica, sans-serif;
    font-weight: 800;
    font-size: clamp(14px, 3vw, 20px);
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow:
      0 0 6px 1px var(--neon-soft),
      0 0 14px 2px rgba(160, 82, 45, 0.8),
      0 0 28px 6px rgba(160, 82, 45, 0.5),
      inset 0 0 6px 1px var(--neon-soft),
      inset 0 0 14px 2px rgba(160, 82, 45, 0.6),
      inset 0 0 24px 4px rgba(160, 82, 45, 0.35);
    text-shadow: 0 0 6px rgba(255,255,255,0.6);
  }

  .page1-title {
    color: #ffffff;
    font-weight: 800;
    font-size: clamp(20px, 5vw, 32px);
    letter-spacing: 0.06em;
    text-shadow: 0 0 6px rgba(255,255,255,0.6);
    margin-bottom: 24px;
    text-align: center;
  }
</style>
</head>
